name: Daily NEPSE bot run

on:
  schedule:
    # NEPSE closes at 15:00 Nepal time (09:15 UTC). Run twice, after the close,
    # Sunday–Friday. The bot only trades when there is a new trading day.
    - cron: "5 10 * * 0-5"    # 15:50 NPT
    - cron: "35 12 * * 0-5"   # 18:20 NPT (catch late data)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nepse-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch data, trade, publish
        run: python -m bot.run
      - name: Commit results
        run: |
          git config user.name "nepse-quant-bot"
          git config user.email "nepse-quant-bot@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Bot run $(TZ=Asia/Kathmandu date '+%Y-%m-%d %H:%M NPT')"
            git push
          fi
      - name: Publish dashboard to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp -r docs /tmp/site && cd /tmp/site
          git init -q && git checkout -q -b gh-pages
          git config user.name "nepse-quant-bot"
          git config user.email "nepse-quant-bot@users.noreply.github.com"
          git add -A && git commit -qm "Publish dashboard $(TZ=Asia/Kathmandu date '+%Y-%m-%d %H:%M NPT')"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
